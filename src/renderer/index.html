<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Nothing is loaded from the network except box art, and no inline code
       runs: the app ships its own script and stylesheet. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'none'">
  <title>WarpEngine Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <button id="nav-toggle" class="nav-toggle" aria-controls="side" aria-expanded="true">
      <span aria-hidden="true">☰</span>
    </button>
    <div class="bar-title">
      <span class="logo" aria-hidden="true">▚</span>
      <span id="app-name">WarpEngine Client</span>
      <!-- Kept for the window check, which reads it to see which store is open; the
           side menu is where a person reads that. -->
      <span class="store-id" id="store-id" hidden></span>
    </div>
    <div class="bar-actions">
      <button id="view-toggle" class="icon-btn view-toggle-active" aria-pressed="false">
        <svg id="view-icon-grid" class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <rect x="2" y="2" width="5" height="5" rx="1" />
          <rect x="9" y="2" width="5" height="5" rx="1" />
          <rect x="2" y="9" width="5" height="5" rx="1" />
          <rect x="9" y="9" width="5" height="5" rx="1" />
        </svg>
        <svg id="view-icon-list" class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden>
          <path d="M3 4h10" />
          <path d="M3 8h10" />
          <path d="M3 12h10" />
        </svg>
      </button>
      <span class="progress" id="progress" hidden></span>
    </div>
  </header>

  <div class="shell">
    <!-- The side menu: which store, what to do with it, and what to look at.
         Collapsed with the button in the bar; the choice is remembered. -->
    <aside class="side" id="side">
      <section class="side-block">
        <h2 class="side-head" id="head-stores"></h2>
        <div class="store-list" id="store-list"></div>
      </section>

      <!--
        Signing in, and who is signed in. The whole block is hidden where the catalog
        offers no sign-in at all, which is most of them: a greyed-out button is telling
        somebody about a door that does not exist.
      -->
      <section class="side-block" id="account-block" hidden>
        <h2 class="side-head" id="head-account"></h2>
        <p class="side-quiet-text" id="account-state"></p>
        <button id="account-action" class="btn btn-ghost btn-wide"></button>
      </section>

      <!--
        The filter: one block per axis. Status is a list, the rest are chips, and the
        axes combine. "Clear" shows only while something is narrowing the catalog.
      -->
      <section class="side-block side-cats">
        <div class="side-head-row">
          <h2 class="side-head" id="head-cats"></h2>
          <button id="filters-clear" class="side-link" hidden></button>
        </div>
        <nav class="cats" id="cats"></nav>
      </section>

      <!--
        The footer: the settings and the version in the corner, the log switch and
        Refresh at the far end. The icons carry their name in `title` and `aria-label`,
        set from the message bundle, so the tooltip and the screen reader stay
        translated while the button stays the size of its glyph.
      -->
      <section class="side-block side-foot">
        <button id="settings-open" class="icon-btn">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="4.6" />
            <circle cx="8" cy="8" r="1.7" />
            <path d="M8 1.2v2.2M8 12.6v2.2M1.2 8h2.2M12.6 8h2.2M3.2 3.2l1.55 1.55M11.25 11.25l1.55 1.55M3.2 12.8l1.55-1.55M11.25 4.75l1.55-1.55" />
          </svg>
        </button>
        <span id="app-version" class="side-version"></span>
        <div class="side-tools">
          <button id="log-toggle" class="side-quiet" aria-expanded="false" aria-controls="log-panel"></button>
          <button id="refresh" class="icon-btn" disabled>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" />
              <path d="M13.5 2v3h-3" />
            </svg>
          </button>
        </div>
      </section>
    </aside>

    <div class="content">
      <!--
        The code to type into a browser. A panel over the grid rather than a screen of
        its own: the catalog is still there and still readable, and the sign-in is
        something happening elsewhere that this window is only reporting on.
      -->
      <section id="signin" class="signin" hidden>
        <h2 id="signin-title"></h2>
        <p id="signin-body"></p>
        <p class="signin-code" id="signin-code"></p>
        <p class="signin-waiting" id="signin-waiting"></p>
        <div class="signin-actions">
          <button id="signin-open" class="btn btn-secondary"></button>
          <button id="signin-cancel" class="btn btn-ghost"></button>
        </div>
      </section>

      <!-- Shown instead of the grid when there is nothing to drive yet. -->
      <section id="gate" class="gate" hidden>
        <h1 id="gate-title"></h1>
        <p id="gate-body"></p>
        <div class="gate-actions">
          <label id="gate-choice" class="gate-choice" hidden>
            <span id="gate-choice-label"></span>
            <select id="gate-select" class="select"></select>
          </label>
          <button id="gate-action" class="btn btn-primary" hidden></button>
          <button id="gate-cancel" class="btn btn-ghost" hidden></button>
          <a id="gate-link" class="link" href="#" hidden></a>
        </div>

        <!--
          A catalog the registry does not list. Its own row under the picker rather
          than a third option inside it: choosing from a list and typing an address are
          different gestures, and a <select> entry that turns into a text field is a
          control that lies about what it is.
        -->
        <div id="gate-custom" class="gate-custom" hidden>
          <span id="gate-custom-label" class="gate-custom-label"></span>
          <div class="gate-custom-row">
            <input id="gate-custom-url" class="input" type="url" spellcheck="false"
                   autocapitalize="off" autocorrect="off">
            <button id="gate-custom-action" class="btn btn-secondary"></button>
          </div>
          <p id="gate-custom-hint" class="gate-custom-hint"></p>
        </div>
      </section>

      <main id="grid" class="grid" hidden></main>
      <main id="catalog-list" class="catalog-list" hidden></main>

      <section id="empty" class="empty" hidden></section>

      <!-- Only on screen while the log is open; the window has no permanent footer. -->
      <section class="log-panel" id="log-panel" hidden>
        <div class="log-lines" id="log-lines"></div>
        <div class="log-paths" id="log-paths"></div>
      </section>
    </div>
  </div>

  <!--
    Settings. A native <dialog>: it brings the focus trap, Escape and the backdrop with
    it, and whether it is up is the state's decision, read by the view like everything
    else. Everything that is not about the catalog in front of you is in here — which
    stores this machine has, the language, the view the window opens with, and whether
    a newer client is out.
  -->
  <dialog id="settings" class="settings">
    <header class="settings-head">
      <h2 id="settings-title" class="settings-title"></h2>
      <button id="settings-close" class="icon-btn">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
    </header>

    <!--
      Three pages under one row of tabs. The tabs are buttons with the ARIA tab roles,
      and which one is showing is in the state, so a redraw cannot flip the page.
    -->
    <div class="settings-tabs" role="tablist" id="settings-tabs">
      <button class="settings-tab" role="tab" id="settings-tab-general"
              aria-controls="settings-panel-general" data-tab="general"></button>
      <button class="settings-tab" role="tab" id="settings-tab-stores"
              aria-controls="settings-panel-stores" data-tab="stores"></button>
      <button class="settings-tab" role="tab" id="settings-tab-updates"
              aria-controls="settings-panel-updates" data-tab="updates"></button>
    </div>

    <section class="settings-panel" role="tabpanel" id="settings-panel-general"
             aria-labelledby="settings-tab-general">
      <div class="settings-row">
        <label class="settings-label" for="locale" id="settings-language-label"></label>
        <select id="locale" class="select"></select>
      </div>
      <div class="settings-row">
        <label class="settings-label" for="view-mode" id="settings-view-label"></label>
        <select id="view-mode" class="select">
          <option value="grid" id="view-mode-grid"></option>
          <option value="list" id="view-mode-list"></option>
        </select>
      </div>
    </section>

    <section class="settings-panel" role="tabpanel" id="settings-panel-stores"
             aria-labelledby="settings-tab-stores" hidden>
      <div class="settings-stores" id="settings-stores"></div>
      <!--
        Two ways in: the list the registry offers, minus what is already here, and a
        typed address. Different gestures, so two rows rather than a <select> entry that
        turns into a text field.
      -->
      <div class="settings-row" id="settings-registry-row">
        <label class="settings-label" for="settings-registry" id="settings-registry-label"></label>
        <div class="settings-inline">
          <select id="settings-registry" class="select settings-grow"></select>
          <button id="settings-registry-add" class="btn btn-secondary"></button>
        </div>
      </div>
      <p class="settings-note" id="settings-registry-note" hidden></p>
      <div class="settings-row">
        <label class="settings-label" for="settings-custom-url" id="settings-custom-label"></label>
        <div class="settings-inline">
          <input id="settings-custom-url" class="input settings-grow" type="url" spellcheck="false"
                 autocapitalize="off" autocorrect="off">
          <button id="settings-custom-add" class="btn btn-secondary"></button>
        </div>
        <p class="settings-note" id="settings-custom-hint"></p>
      </div>
    </section>

    <!--
      Two kinds of update, kept apart: this client, which is checked on request and
      downloaded from the release page; and the titles here, which the catalog already
      says are behind and which are upgraded in place.
    -->
    <section class="settings-panel" role="tabpanel" id="settings-panel-updates"
             aria-labelledby="settings-tab-updates" hidden>
      <div class="settings-block">
        <h3 class="side-head" id="settings-client-head"></h3>
        <div class="settings-inline">
          <span class="settings-label" id="settings-version-head"></span>
          <span id="settings-version" class="settings-version"></span>
        </div>
        <div class="settings-inline">
          <button id="update-check" class="btn btn-secondary"></button>
          <span class="settings-note settings-update-state" id="update-state" hidden></span>
        </div>
        <button id="update-open" class="btn btn-primary" hidden></button>
      </div>
      <div class="settings-block">
        <div class="settings-block-head">
          <h3 class="side-head" id="settings-games-head"></h3>
          <button id="upgrade-all" class="btn btn-secondary btn-tiny" hidden></button>
        </div>
        <p class="settings-note" id="settings-games-empty" hidden></p>
        <div class="settings-updates" id="settings-updates"></div>
      </div>
    </section>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
